services:
  app:
    profiles: ["disabled"]

  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run build -w @nexo-assist/shared && npm run dev -w @nexo-assist/api"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - nexo-data:/app/data

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -w @nexo-assist/web -- --host 0.0.0.0 --port 5173"
    environment:
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules

volumes:
  nexo-data:
  api_node_modules:
  web_node_modules:
